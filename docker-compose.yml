services:
  mongo:
    image: mongo:7
    container_name: sticker-bot-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  bot:
    build:
      context: .
      args:
        INSTALL_LOCAL_AI: ${INSTALL_LOCAL_AI:-0}
    container_name: telegram-ai-sticker-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Uses .env value if set, otherwise the bundled MongoDB container.
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs

volumes:
  mongo_data:
  bot_data:
  bot_logs:
